name: Rivet checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-rust-
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency policy
        run: python tools/check_dependencies.py
      - name: Policy tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Offline doctor
        run: cargo run --locked -p rivet -- doctor

      - name: Headless UI algorithms
        run: cargo run --locked -p rivet -- bench-ui
      - name: Shared editor CPU benchmark
        run: cargo run --locked --release -p rivet-core --example bench_editor
      - name: Native macOS UI smoke
        if: runner.os == 'macOS'
        run: python tools/run_macos_smoke.py
      - name: Upload native UI evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-smoke
          path: |
            rivet-ui-smoke.log
            rivet-ui-smoke.png
          if-no-files-found: warn

      - name: Live workspace native controls (test backend)
        if: runner.os == 'macOS'
        run: python tools/run_live_smoke.py
      - name: Upload live workspace diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-live-workspace
          path: |
            rivet-live-smoke.log
            rivet-live-sample.txt
            rivet-live-*.png
          if-no-files-found: warn
      - name: Assemble development app bundle
        if: runner.os == 'macOS'
        run: python tools/package_macos.py --binary target/debug/rivet
      - name: Per-user development install and update
        if: runner.os == 'macOS'
        run: |
          bash tools/install_macos.sh dist/Rivet.app
          bash tools/install_macos.sh dist/Rivet.app
          codesign --verify --deep --strict "$HOME/Applications/Rivet.app"
          RIVET_MACOS_BINARY="$HOME/Applications/Rivet.app/Contents/MacOS/rivet" python3 tools/run_live_smoke.py
      - name: Launch extracted Mac download
        if: runner.os == 'macOS'
        run: |
          ditto -x -k dist/Rivet-macOS-development.zip dist/portable-macos
          codesign --verify --deep --strict dist/portable-macos/Rivet.app
          RIVET_MACOS_BINARY="$PWD/dist/portable-macos/Rivet.app/Contents/MacOS/rivet" python3 tools/run_live_smoke.py
      - name: Upload development bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rivet-macos-development
          path: dist/Rivet-macOS-development.zip
      - name: Prepare native Windows browser loader
        if: runner.os == 'Windows'
        run: python tools/prepare_webview2.py target/debug
      - name: Ensure Windows CI browser runtime
        if: runner.os == 'Windows'
        run: python tools/ensure_windows_webview2.py
      - name: Native Windows workspace smoke (test agent transport)
        if: runner.os == 'Windows'
        run: python tools/run_windows_smoke.py
      - name: Upload native Windows evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-workspace
          path: |
            rivet-windows-smoke.log
            rivet-windows-*.bmp
          if-no-files-found: warn
      - name: Assemble per-user Windows package
        if: runner.os == 'Windows'
        run: ./tools/package_windows.ps1
      - name: Per-user Windows install, update, launch, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/install_windows.ps1 -Source dist/windows
          $extra = Join-Path $env:LOCALAPPDATA 'Programs/Rivet/user-note.txt'
          Set-Content -LiteralPath $extra -Value 'preserve across update and uninstall'
          ./tools/install_windows.ps1 -Source dist/windows
          if ((Get-Content -LiteralPath $extra) -ne 'preserve across update and uninstall') { throw 'Update removed user file' }
          $env:RIVET_WINDOWS_BINARY = Join-Path $env:LOCALAPPDATA 'Programs/Rivet/Rivet.exe'
          python tools/run_windows_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
          ./tools/uninstall_windows.ps1
          if (Test-Path $env:RIVET_WINDOWS_BINARY) { throw 'Uninstall left executable behind' }
          if (-not (Test-Path $extra)) { throw 'Uninstall removed user file' }
          Remove-Item -LiteralPath $extra
      - name: Launch extracted Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/Rivet-Windows-x64-development.zip -DestinationPath dist/portable-windows
          $env:RIVET_WINDOWS_BINARY = (Resolve-Path dist/portable-windows/Rivet.exe).Path
          python tools/run_windows_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable app smoke failed' }
      - name: Upload Windows development package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rivet-windows-x64-development
          path: dist/Rivet-Windows-x64-development.zip

  downloads:
    name: Prepare install downloads
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rivet-windows-x64-development
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: rivet-macos-development
          path: artifacts/macos
      - name: Validate architectures and prepare checksummed downloads
        run: python3 tools/publish_preview.py --prepare-only
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-install-downloads
          path: downloads/*
          compression-level: 0
          if-no-files-found: error

  publish-preview:
    name: Publish preview downloads
    needs: downloads
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: rivet-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rivet-install-downloads
          path: downloads
      - name: Publish verified preview assets and source reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_preview.py --publish-only
