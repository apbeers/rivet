name: Rivet checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Dependency policy
        run: python tools/check_dependencies.py
      - name: Policy tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Tests
        run: cargo test --workspace --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Offline doctor
        run: cargo run --locked -p rivet -- doctor

      - name: Headless UI algorithms
        run: cargo run --locked -p rivet -- bench-ui
      - name: Native macOS UI smoke
        if: runner.os == 'macOS'
        run: python tools/run_macos_smoke.py
      - name: Upload native UI evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-smoke
          path: |
            rivet-ui-smoke.log
            rivet-ui-smoke.png
          if-no-files-found: warn

      - name: Live workspace native controls (test backend)
        if: runner.os == 'macOS'
        run: python -c "import subprocess; r = subprocess.run(['target/debug/rivet', 'ui', '--live-smoke'], capture_output=True, text=True, timeout=60); print(r.stdout); print(r.stderr); assert r.returncode == 0 and 'RIVET_LIVE_UI_SMOKE_PASS' in r.stdout"
